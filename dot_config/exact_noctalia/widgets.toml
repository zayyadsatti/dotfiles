
[widget.clock]
capsule = true

[widget.media]
capsule = true
capsule_radius = "auto"
hide_when_no_media = true
scale = 0.80000000000000004
title_scroll = "on_hover"

[widget.wallpaper]
capsule = true

[widget.workspaces]
display = "name"
hide_when_empty = true
max_labels_chars = 3
minimal = false
active_pill_size = 2.3
inactive_pill_size = 1.0
focused_color = "primary"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.cpu-graph]
type = "sysmon"
stat = "cpu_usage"
display = "graph"
show_label = false

[widget.temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.disk]
type = "sysmon"
stat = "disk_pct"
path = "/"

[widget.wifi-download]
type = "sysmon"
stat = "net_rx"
interface = "wlan0"
network_speed_compact = true

[widget.wifi-upload]
type = "sysmon"
stat = "net_tx"
interface = "wlan0"
network_speed_compact = true

[widget.brightness]
scroll_step = 5
show_label = true

[widget.bluetooth]
show_label = false

[widget.network]
show_label = false

[widget.weather]
max_length = 180
show_condition = false
show_temperature = true
