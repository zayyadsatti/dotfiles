background {
  monitor =
  path = /home/zayyad/pix/wallpapers/a-chosen-soul-ME1_AXA5lAM-unsplash.jpg
  blur_passes = 1
  contrast = 1
  brightness = 0.5
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

general {
  hide_cursor = true
}

animations {
  enable = false
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 60
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(0, 0, 0, 0)
  font_color = rgb(255, 255, 255)
  fade_on_empty = false
  rounding = -1
  check_color = rgb(204, 136, 34)
  placeholder_text = <i><span foreground="##ffffff">Input Password...</span></i>
  hide_input = false
  position = 0, -200
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] date +"%A, %B %d %Y"
  color = rgba(242, 243, 244, 0.75)
  font_size = 30
  font_family = Digital-7 Mono
  position = 0, 250
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] date +"%I:%M:%S"
  color = rgba(242, 243, 244, 0.75)
  font_size = 120
  font_family = Digital-7 Mono
  position = 0, 350
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] whoami
  color = $foreground
  font_size = 40               
  font_family = JetBrains Mono Bold Italic
  position = 0, -80
  halign = center
}

